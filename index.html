<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QPS RAW 대시보드 v8.5.5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{margin:0;padding:20px;font-family:Arial,"Malgun Gothic",sans-serif;background:#f5f7fb;color:#1f2937}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.08);padding:16px;margin-bottom:16px}
.title{font-size:28px;font-weight:800}.subtitle{font-size:14px;color:#6b7280;margin-top:4px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}.group{display:flex;flex-direction:column;gap:6px;min-width:260px}
.group label{font-size:12px;color:#6b7280;font-weight:700} input[type="file"]{padding:10px;background:#fff;border:1px solid #e5e7eb;border-radius:10px}
.status{font-size:13px;color:#6b7280;min-height:18px;margin-top:10px}
.debug{font-size:12px;color:#475569;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 12px;white-space:pre-wrap;margin-top:10px;max-height:220px;overflow:auto}
.empty{padding:84px 24px;text-align:center;color:#6b7280;font-size:18px}.section{display:none}
.machine-grid,.zones{display:grid;grid-template-columns:repeat(3,minmax(340px,1fr));gap:18px}.machine-grid{margin-bottom:18px}
.machine-card{padding:16px 18px}.machine-name{font-size:22px;font-weight:800}
.metrics{display:flex;gap:20px;flex-wrap:nowrap;justify-content:center;align-items:flex-start;color:#6b7280;font-size:13px;margin-top:10px}
.metric{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:85px}
.metric b{display:block;color:#1f2937;font-size:22px;margin-top:2px}
.metric .share{display:block;font-size:11px;color:#9ca3af;margin-top:4px;font-weight:700}
.aps-block{padding:14px}.aps-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:2px 4px 12px;border-bottom:1px solid #e5e7eb;margin-bottom:14px}.aps-title{font-size:20px;font-weight:800}
.zone-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.zone-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-end;padding:6px 8px 10px;font-size:16px;font-weight:800}
.spark-stack{display:grid;gap:10px}

/* 변경 영역: 불필요한 텍스트 제거 및 비율 조정, blank의 visibility 수정 */
.spark-row{display:grid;grid-template-columns:40px 1fr 70px;gap:8px;align-items:center;min-height:52px}
.spark-row.blank{visibility:hidden} 

.ws-label{font-size:13px;font-weight:700;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark-track{width:100%;height:14px;background:#eef2f7;border-radius:999px;overflow:hidden;border:1px solid #e2e8f0}
.spark-fill{height:100%;border-radius:999px}
.spark-value{text-align:right;font-size:11px;font-weight:700;color:#475569;white-space:nowrap;line-height:1.45}
.footer-note{margin-top:14px;font-size:12px;color:#6b7280}
.subhead{font-size:18px;font-weight:800;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #e5e7eb;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f8fafc}
.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}
.pill.bad{background:#fef2f2;color:#b91c1c}
#loadingOverlay{position:fixed;inset:0;background:rgba(255,255,255,.68);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:9999}
.loader-box{width:120px;height:120px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 8px 24px rgba(15,23,42,.08);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loader{width:46px;height:46px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}.loader-text{font-size:13px;color:#6b7280;font-weight:700}@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1280px){.machine-grid,.zones{grid-template-columns:1fr}.metrics{flex-wrap:wrap}}
.btn-pass{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px;font-weight:bold;transition:0.2s}
.btn-pass:hover{background:#fee2e2}
.btn-reset{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;color:#475569;font-weight:bold;transition:0.2s}
.btn-reset:hover{background:#e2e8f0}
</style>
</head>
<body>
<div id="loadingOverlay"><div class="loader-box"><div class="loader"></div><div class="loader-text">불러오는 중</div></div></div>

<div class="card">
  <div class="title">QPS RAW 대시보드 v8.5.5</div>
  <div class="subtitle">노드 터치수(SKU) 최우선 기반 진척률 + 병목 모니터링 적용</div>
</div>

<div class="card">
  <div class="row">
    <div class="group">
      <label>박스상품 상세정보 RAW</label>
      <input type="file" id="boxFile" accept=".xlsx,.xls">
    </div>
    <div class="group">
      <label>셀할당현황 RAW</label>
      <input type="file" id="cellFile" accept=".xlsx,.xls">
    </div>
  </div>
  <div class="status" id="status">두 파일을 모두 업로드하면 W/S별 터치수와 진척률을 계산합니다.</div>
</div>

<div id="emptyState" class="card empty">파일 2개를 모두 업로드해야 데이터가 표시됩니다.</div>

<div id="content" class="section">
  <div class="machine-grid" id="machineSummary"></div>
  <div class="zones" id="zonesArea"></div>

  <div class="card">
    <div class="subhead" style="display:flex; justify-content:space-between; align-items:center;">
      <span>셀 이동 추천</span>
      <button class="btn-reset" onclick="resetIgnored()">패스 목록 초기화</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>순번</th><th>SKU</th><th>상품명</th><th>PCS</th><th>현 재고</th><th>토트 유입수</th><th>온도대</th><th>현재 셀</th><th>현재 랙</th><th>현재 우선순위</th><th>권장 랙</th><th>추천 셀</th><th>사유</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="recommendBody"></tbody>
    </table>
  </div>

  <div class="footer-note" id="footNote"></div>
</div>

<div class="card">
  <div class="debug" id="debugLog">대기 중</div>
</div>

<script>
// 변경 영역: APS3 E존 배열 길이 맞춤 (null 추가)
const zoneDefs = {
  APS1:{label:'1호기',cols:[
    {zone:'A존',order:['APS1-01','APS1-02','APS1-03','APS1-04','APS1-05','APS1-06','APS1-07','APS1-08','APS1-09','APS1-10']},
    {zone:'B존',order:['APS1-20','APS1-19','APS1-18','APS1-17','APS1-16','APS1-15','APS1-14','APS1-13','APS1-12','APS1-11']}
  ]},
  APS2:{label:'2호기',cols:[
    {zone:'C존',order:['APS2-01','APS2-02','APS2-03','APS2-04','APS2-05','APS2-06','APS2-07','APS2-08','APS2-09','APS2-10']},
    {zone:'D존',order:['APS2-20','APS2-19','APS2-18','APS2-17','APS2-16','APS2-15','APS2-14','APS2-13','APS2-12','APS2-11']}
  ]},
  APS3:{label:'3호기',cols:[
    {zone:'E존',order:[null,'APS3-07','APS3-06','APS3-05','APS3-04',null,null,'APS3-03','APS3-02','APS3-01',null,null]},
    {zone:'F존',order:['APS3-08','APS3-09','APS3-10','APS3-11','APS3-12','APS3-13','APS3-14','APS3-15','APS3-16','APS3-17','APS3-18','APS3-19']}
  ]}
};
const machineList=['APS1','APS2','APS3'];
let boxRows=null, cellRows=null, boxMeta=null, cellMeta=null;
window.qpsAllData = null; 
const $=s=>document.querySelector(s);

const COMPLETE_STATUS=['피킹완료','토트매핑완료','패킹완료','출고완료','출하완료','배송완료'];
const EXCLUDE_STATUS=['전체취소','전체결품','출고불가','취소대기'];

function setStatus(msg,isError=false){
  const el=$('#status');
  el.textContent=msg;
  el.style.color=isError?'#b91c1c':'#6b7280';
}
function appendDebug(msg){
  const el=$('#debugLog');
  const time=new Date().toLocaleTimeString('ko-KR');
  el.textContent=`[${time}] ${msg}\n`+(el.textContent==='대기 중'?'':el.textContent);
}
function showLoading(on){$('#loadingOverlay').style.display=on?'flex':'none';}
function fmt(n){return (n??0).toLocaleString('ko-KR');}
function fmtPct(n){return `${(n*100).toFixed(1)}%`;}
function toNumber(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return isFinite(v)?v:0;
  const num=Number(String(v).replace(/,/g,'').trim());
  return isFinite(num)?num:0;
}
function normalizeWs(v){
  if(v==null) return null;
  const s=String(v).toUpperCase().replace(/\s+/g,'').replace(/_/g,'-');
  const m=s.match(/APS\s*([123])[- ]?(\d{1,2})/i);
  return m?`APS${m[1]}-${String(m[2]).padStart(2,'0')}`:null;
}
function normalizeSheetName(v){return String(v||'').replace(/\s+/g,'').toLowerCase();}
function normalizeSku(v){
  if(v==null) return '';
  let s=String(v).trim();
  s=s.replace(/\.0+$/,'').replace(/[^\d]/g,'');
  if(!s) return '';
  return s.padStart(13,'0');
}
function normalizeTemp(code){
  const s=String(code||'').trim();
  if(s==='WET 냉동') return 'frozen';
  if(s==='WET 일반'||s==='WET 냉장') return 'chilled';
  return 'unknown';
}
function tempLabel(temp){
  if(temp==='frozen') return '냉동';
  if(temp==='chilled') return '냉장';
  return '기타';
}
function heatColor(value,min,max){
  if(value==null||isNaN(value)) return '#dbeafe';
  if(max===min) return 'hsl(8,85%,60%)';
  const t=Math.max(0,Math.min(1,(value-min)/(max-min)));
  const hue=220-(220*t);
  return `hsl(${hue},82%,${62-(t*10)}%)`;
}

function ensureXLSX(){
  if(typeof XLSX==='undefined') throw new Error('XLSX 라이브러리 로딩 실패');
}
function readSheetRows(workbook,sheetName){
  const ws=workbook.Sheets[sheetName];
  return XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
}
function headersOfRows(rows){return rows&&rows.length?Object.keys(rows[0]):[];}
function findStatusColumns(headers){
  const candidates=headers.filter(h=>String(h).includes('WMS배송진행상태'));
  return {all:candidates, primary:candidates[candidates.length-1] || null};
}
function findBestSheet(workbook,type){
  const required=type==='box'
    ? ['물류상품ID','피킹지시수량']
    : ['작업대','물류상품ID','보관위치','랙유형','물류분류코드','현재고'];
  const preferredNames=type==='box'
    ? ['박스상품상세정보']
    : ['셀할당현황','셀할당 현황'];
  let candidate=null;

  for(const name of workbook.SheetNames){
    const norm=normalizeSheetName(name);
    if(preferredNames.some(p=>norm.includes(normalizeSheetName(p)))){
      const rows=readSheetRows(workbook,name);
      const headers=headersOfRows(rows);
      if(required.every(h=>headers.includes(h))) return {sheetName:name,rows};
      candidate={sheetName:name,rows};
    }
  }

  for(const name of workbook.SheetNames){
    const rows=readSheetRows(workbook,name);
    const headers=headersOfRows(rows);
    if(required.every(h=>headers.includes(h))) return {sheetName:name,rows};
  }
  return candidate;
}
async function readExcelRows(file,type){
  ensureXLSX();
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  const found=findBestSheet(wb,type);
  return {
    workbookSheetNames:wb.SheetNames,
    sheetName:found?found.sheetName:null,
    rows:found?found.rows:[]
  };
}
function getProductName(row){return String(row['물류상품명']||row['상품명']||'').trim();}
function makeToteKey(row){
  const d=String(row['배송번호']||'').trim();
  const b=String(row['배송박스순번']||'').trim();
  if(!d || !b) return '';
  return `${d}__${b}`;
}

function buildAllData(boxRows,cellRows){
  const boxHeaders=headersOfRows(boxRows);
  const statusCols=findStatusColumns(boxHeaders);
  const statusCol=statusCols.primary;

  const skuToPcs=new Map();
  const skuMeta=new Map();
  const skuToToteCount=new Map();

  const wsMetrics=new Map();
  const skuToWsSet=new Map();
  const assignedCells=[];
  const emptyCells=[];
  
  for(const row of cellRows){
    const ws=normalizeWs(row['작업대']);
    const sku=normalizeSku(row['물류상품ID']);
    const location=String(row['보관위치']||'').trim();
    const zone=String(location).slice(0,3);
    const rackType=String(row['랙유형']||'').trim();
    const temp=normalizeTemp(row['물류분류코드']);
    const stock=toNumber(row['현재고']);
    const productName=getProductName(row);

    const cell={ws,sku,location,zone,rackType,temp,stock,isEmpty:!sku,productName};
    
    if(cell.isEmpty){
      emptyCells.push(cell);
    }else{
      assignedCells.push(cell);
      if(!skuToWsSet.has(sku)) skuToWsSet.set(sku,new Set());
      if(ws) skuToWsSet.get(sku).add(ws);

      if(!wsMetrics.has(ws)){
        wsMetrics.set(ws,{
          inboundTotes: new Set(),
          totalTouches: 0,
          completeTouches: 0,
          totalTouchPcs: 0
        });
      }
    }
  }

  const touchMap = new Map();
  for(const row of boxRows){
    const sku=normalizeSku(row['물류상품ID']);
    const toteKey=makeToteKey(row);
    if(!sku || !toteKey) continue;

    const pcs=toNumber(row['피킹지시수량']);
    const status=String(statusCol ? row[statusCol] : '').trim();
    
    if(EXCLUDE_STATUS.includes(status)) continue;

    if(!skuMeta.has(sku)) skuMeta.set(sku,{name:getProductName(row)});
    skuToPcs.set(sku,(skuToPcs.get(sku)||0)+pcs);

    const key = `${toteKey}||${sku}`;
    if(!touchMap.has(key)) {
      touchMap.set(key, { pcs: 0, isComplete: true, wsSet: new Set() });
      skuToToteCount.set(sku, (skuToToteCount.get(sku)||0)+1);
    }
    
    const entry = touchMap.get(key);
    entry.pcs += pcs;
    
    if(!COMPLETE_STATUS.includes(status)) {
      entry.isComplete = false;
    }
    
    const candidateWs = skuToWsSet.get(sku);
    if(candidateWs) {
      for(const ws of candidateWs) entry.wsSet.add(ws);
    }
  }

  let totalDirectedTouches = 0, totalCompleteTouches = 0;
  for(const [key, entry] of touchMap.entries()){
    const [toteKey] = key.split('||');
    for(const ws of entry.wsSet){
      if(!wsMetrics.has(ws)) continue;
      const m = wsMetrics.get(ws);
      
      m.inboundTotes.add(toteKey);
      m.totalTouches += 1;
      m.totalTouchPcs += entry.pcs;
      totalDirectedTouches += 1;
      
      if(entry.isComplete){
        m.completeTouches += 1;
        totalCompleteTouches += 1;
      }
    }
  }

  const wsResult={};
  for(const [ws,m] of wsMetrics.entries()){
    wsResult[ws]={
      inboundToteCount: m.inboundTotes.size,
      totalTouches: m.totalTouches,
      completeTouches: m.completeTouches,
      totalTouchPcs: m.totalTouchPcs,
      progressRate: m.totalTouches ? (m.completeTouches / m.totalTouches) : 0,
      pcsPerTouch: m.totalTouches ? (m.totalTouchPcs / m.totalTouches) : 0
    };
  }

  return {
    skuToPcs,
    skuToToteCount,
    skuMeta,
    wsMetrics: wsResult,
    emptyCells,
    assignedCells,
    totalDirectedTouches,
    totalCompleteTouches
  };
}

function computeZoneStats(wsMetrics){
  const res={};
  for(const machine of machineList){
    const def=zoneDefs[machine];
    let machineInTotes=0, machineTouches=0, machineCompTouches=0, machinePcs=0;
    res[machine]={zones:{}, inboundTotes:0, totalTouches:0, completeTouches:0, progressRate:0, pcsPerTouch:0};

    for(const col of def.cols){
      let zInTotes=0, zTouches=0, zCompTouches=0, zPcs=0;
      for(const ws of col.order){
        if(!ws) continue;
        const m=wsMetrics[ws] || {inboundToteCount:0, totalTouches:0, completeTouches:0, totalTouchPcs:0};
        
        zInTotes += m.inboundToteCount||0;
        zTouches += m.totalTouches||0;
        zCompTouches += m.completeTouches||0;
        zPcs += m.totalTouchPcs||0;

        machineInTotes += m.inboundToteCount||0;
        machineTouches += m.totalTouches||0;
        machineCompTouches += m.completeTouches||0;
        machinePcs += m.totalTouchPcs||0;
      }
      res[machine].zones[col.zone]={
        inboundTotes: zInTotes,
        totalTouches: zTouches,
        completeTouches: zCompTouches,
        progressRate: zTouches ? zCompTouches/zTouches : 0,
        pcsPerTouch: zTouches ? zPcs/zTouches : 0
      };
    }

    res[machine].inboundTotes=machineInTotes;
    res[machine].totalTouches=machineTouches;
    res[machine].completeTouches=machineCompTouches;
    res[machine].progressRate=machineTouches ? machineCompTouches/machineTouches : 0;
    res[machine].pcsPerTouch=machineTouches ? machinePcs/machineTouches : 0;
  }
  return res;
}

// 패스(제외) 기능을 위한 함수
window.ignoreSku = function(sku) {
  const ignored = new Set(JSON.parse(localStorage.getItem('qps_ignored_skus') || '[]'));
  ignored.add(sku);
  localStorage.setItem('qps_ignored_skus', JSON.stringify([...ignored]));
  if(window.qpsAllData) drawScreen(window.qpsAllData);
};

window.resetIgnored = function() {
  localStorage.removeItem('qps_ignored_skus');
  if(window.qpsAllData) drawScreen(window.qpsAllData);
};

// 변경 영역: 명칭 축약 함수 추가
function formatWsName(ws){
  if(!ws) return '';
  const m = ws.match(/APS(\d+)-0*(\d+)/);
  return m ? `${m[1]}-${m[2]}` : ws;
}

function drawScreen(allData){
  const touchValues=Object.values(allData.wsMetrics).map(v=>v.totalTouches||0);
  const min=touchValues.length?Math.min(...touchValues):0;
  const max=touchValues.length?Math.max(...touchValues):0;
  const stats=computeZoneStats(allData.wsMetrics);

  $('#machineSummary').innerHTML=machineList.map(machine=>{
    const st=stats[machine];
    return `
      <div class="card machine-card">
        <div class="machine-name">${zoneDefs[machine].label}(요약)</div>
        <div class="metrics">
          <div class="metric">지시 터치수<b>${fmt(st.totalTouches)}</b><span class="share">메인 공수 지표</span></div>
          <div class="metric">완료 터치수<b>${fmt(st.completeTouches)}</b><span class="share">실시간 처리량</span></div>
          <div class="metric">진척률 (Touch)<b>${fmtPct(st.progressRate)}</b></div>
          <div class="metric">유입 토트수<b>${fmt(st.inboundTotes)}</b><span class="share">버퍼 모니터링</span></div>
          <div class="metric">터치당 PCS<b style="color:#ef4444">${st.pcsPerTouch.toFixed(1)}</b><span class="share">다건 병목</span></div>
        </div>
      </div>`;
  }).join('');

  $('#zonesArea').innerHTML=machineList.map(machine=>{
    const def=zoneDefs[machine];
    
    const machineWs = [];
    for (const col of def.cols) {
      for (const ws of col.order) {
        if (ws && allData.wsMetrics[ws] && allData.wsMetrics[ws].totalTouches > 0) {
          machineWs.push({ ws, progress: allData.wsMetrics[ws].progressRate });
        }
      }
    }
    machineWs.sort((a, b) => a.progress - b.progress);
    const bottom3Ws = new Set(machineWs.slice(0, 3).map(x => x.ws));

    return `<div class="card aps-block"><div class="aps-head"><div class="aps-title">${zoneDefs[machine].label}</div></div><div class="zone-columns">${
      def.cols.map(col=>`<div class="zone-col"><div class="zone-head"><span>${col.zone}</span></div><div class="spark-stack">${
        col.order.map(ws=>{
          if(!ws) return `<div class="spark-row blank"></div>`;
          const m=allData.wsMetrics[ws]||{inboundToteCount:0,totalTouches:0,completeTouches:0,progressRate:0,pcsPerTouch:0};
          const touch=m.totalTouches||0;
          const progress=m.progressRate||0;
          
          const touchWidth=max>0?Math.max(touch>0?3:0,(touch/max)*100):0;
          const touchBarColor=heatColor(touch,min,max);
          
          const isBottom3 = bottom3Ws.has(ws);
          const progressStyle = isBottom3 
            ? 'color:#b91c1c; font-weight:900; background:#fee2e2; padding:2px 6px; border-radius:4px; display:inline-block; margin-top:2px;' 
            : 'color:#2563eb;';

          // 변경 영역: 레이아웃 구조 축소, 불필요 텍스트 삭제
          return `
            <div class="spark-row">
              <div class="ws-label">${formatWsName(ws)}</div>
              <div class="spark-track"><div class="spark-fill" style="width:${touchWidth}%;background:${touchBarColor};"></div></div>
              <div class="spark-value" style="text-align:right; line-height:1.4;">
                터치 ${fmt(touch)}<br>
                진척 <b style="${progressStyle}">${fmtPct(progress)}</b>
              </div>
            </div>
          `;
        }).join('')
      }</div></div>`).join('')
    }</div></div>`;
  }).join('');

  const recs=buildRecommendations(allData);
  const ignoredSkus = new Set(JSON.parse(localStorage.getItem('qps_ignored_skus') || '[]'));
  
  const displayRecs = recs.filter(r => !ignoredSkus.has(r.sku)).slice(0, 20);

  $('#recommendBody').innerHTML=
    displayRecs.map((r,idx)=>`<tr><td>${idx+1}</td><td>${r.sku}</td><td>${r.productName||''}</td><td>${fmt(r.pcs)}</td><td>${fmt(r.stock)}</td><td>${fmt(r.toteCount)}</td><td>${tempLabel(r.temp)}</td><td>${r.currentCell}</td><td>${r.currentRack}</td><td><span class="pill ${r.currentRank<=2?'bad':''}">${r.currentRank}</span></td><td>${r.targetRack}</td><td>${r.targetCell}</td><td>${r.reason}</td><td><button class="btn-pass" onclick="ignoreSku('${r.sku}')">패스</button></td></tr>`).join('')
    || '<tr><td colspan="14">추천 결과 없음</td></tr>';

  const boxInfo=boxMeta?`${boxMeta.fileName} / 시트: ${boxMeta.sheetName||'미탐지'}`:'-';
  const cellInfo=cellMeta?`${cellMeta.fileName} / 시트: ${cellMeta.sheetName||'미탐지'}`:'-';
  $('#footNote').textContent=`박스상품 상세정보: ${boxInfo} · 셀할당현황: ${cellInfo}`;
  $('#emptyState').style.display='none';
  $('#content').style.display='block';
}

function validateRows(rows,type){
  if(!rows||!rows.length) return `${type} 시트에 데이터가 없습니다.`;
  const headers=headersOfRows(rows);
  if(type==='박스상품 상세정보'){
    for(const col of ['물류상품ID','피킹지시수량','배송번호','배송박스순번']){
      if(!headers.includes(col)) return `${type} 시트에 "${col}" 컬럼이 없습니다.`;
    }
    const st=findStatusColumns(headers);
    if(!st.primary) return `${type} 시트에 "WMS배송진행상태" 컬럼을 찾지 못했습니다.`;
  }else{
    for(const col of ['작업대','물류상품ID','보관위치','랙유형','물류분류코드','현재고']){
      if(!headers.includes(col)) return `${type} 시트에 "${col}" 컬럼이 없습니다.`;
    }
  }
  return null;
}

async function tryBuild(){
  if(!(boxRows&&cellRows)) return;
  showLoading(true);
  try{
    const err1=validateRows(boxRows,'박스상품 상세정보');
    if(err1){setStatus(err1,true);appendDebug(err1);return;}
    const err2=validateRows(cellRows,'셀할당현황');
    if(err2){setStatus(err2,true);appendDebug(err2);return;}

    const allData=buildAllData(boxRows,cellRows);
    window.qpsAllData = allData; 
    appendDebug(`총 지시 터치수=${allData.totalDirectedTouches}, 완료 터치수=${allData.totalCompleteTouches}`);

    if(!Object.keys(allData.wsMetrics).length){
      const msg='매핑된 작업대 결과가 없습니다. 작업대 또는 SKU 형식을 확인해 주세요.';
      setStatus(msg,true);
      appendDebug(msg);
      $('#content').style.display='none';
      $('#emptyState').style.display='block';
      return;
    }

    drawScreen(allData);
    setStatus('RAW 데이터 분석 완료');
    appendDebug('RAW 데이터 분석 완료');
  }catch(err){
    console.error(err);
    const msg='파일 분석 중 오류가 발생했습니다: '+(err.message||err);
    setStatus(msg,true);
    appendDebug(msg);
    $('#content').style.display='none';
    $('#emptyState').style.display='block';
  }finally{
    showLoading(false);
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  if(typeof XLSX==='undefined'){
    setStatus('XLSX 라이브러리 로딩 실패',true);
    appendDebug('XLSX 라이브러리 로딩 실패');
  }else{
    appendDebug('XLSX 라이브러리 로딩 성공');
  }
});

$('#boxFile').addEventListener('change', async e=>{
  const file=e.target.files[0];
  if(!file) return;
  showLoading(true);
  try{
    appendDebug(`박스상품 상세정보 파일 선택: ${file.name}`);
    const result=await readExcelRows(file,'box');
    boxRows=result.rows;
    boxMeta={fileName:file.name,sheetName:result.sheetName};
    const msg=`박스상품 상세정보 업로드 완료 / 시트: ${result.sheetName||'미탐지'} / 시트목록: ${result.workbookSheetNames.join(', ')}`;
    setStatus(msg);
    appendDebug(msg);
  }catch(err){
    console.error(err);
    boxRows=null;
    const msg='박스상품 상세정보 파일 읽기에 실패했습니다: '+(err.message||err);
    setStatus(msg,true);
    appendDebug(msg);
  }finally{
    showLoading(false);
  }
  await tryBuild();
});

$('#cellFile').addEventListener('change', async e=>{
  const file=e.target.files[0];
  if(!file) return;
  showLoading(true);
  try{
    appendDebug(`셀할당현황 파일 선택: ${file.name}`);
    const result=await readExcelRows(file,'cell');
    cellRows=result.rows;
    cellMeta={fileName:file.name,sheetName:result.sheetName};
    const msg=`셀할당현황 업로드 완료 / 시트: ${result.sheetName||'미탐지'} / 시트목록: ${result.workbookSheetNames.join(', ')}`;
    setStatus(msg);
    appendDebug(msg);
  }catch(err){
    console.error(err);
    cellRows=null;
    const msg='셀할당현황 파일 읽기에 실패했습니다: '+(err.message||err);
    setStatus(msg,true);
    appendDebug(msg);
  }finally{
    showLoading(false);
  }
  await tryBuild();
});
</script>
